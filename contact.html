<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Darokel Store</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .contact-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 4rem 2rem;
        }
        .contact-header {
            text-align: center;
            margin-bottom: 3rem;
        }
        .contact-header h1 {
            font-family: var(--font-display);
            font-size: 3rem;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .contact-header p {
            color: var(--text-muted);
            font-size: 1.1rem;
        }
        .contact-card {
            border-radius: 20px;
            padding: 3rem;
            display: grid;
            grid-template-columns: 1fr;
            gap: 2rem;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }
        .form-group label {
            font-weight: 500;
            color: var(--text-muted);
        }
        .form-control {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            padding: 1rem;
            color: white;
            font-family: var(--font-main);
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        .form-control:focus {
            outline: none;
            border-color: var(--accent-primary);
            box-shadow: 0 0 15px var(--accent-glow);
        }
        textarea.form-control {
            resize: vertical;
            min-height: 150px;
        }
        .contact-info {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            margin-top: 3rem;
            padding-top: 3rem;
            border-top: 1px solid var(--glass-border);
        }
        .info-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            color: var(--text-muted);
        }
        .info-icon {
            background: rgba(255,255,255,0.05);
            padding: 1rem;
            border-radius: 50%;
            color: var(--accent-primary);
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>
    <header class="glass">
        <div class="nav-container">
            <a href="index.html" class="logo">Darokel Store</a>
            <nav style="display: flex; align-items: center; gap: 2rem;">
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="contact.html" class="active">Contact Us</a></li>
                    <li><a href="shop.html">Shop</a></li>
                </ul>
                <form class="search-form" onsubmit="event.preventDefault(); window.location.href='shop.html?search='+this.querySelector('.search-input').value;">
                    <input type="text" placeholder="Search products..." class="search-input">
                    <button type="submit" class="search-btn" aria-label="Search">
                        <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    </button>
                </form>
            </nav>
            <a href="cart.html" class="cart-icon" aria-label="Shopping Cart">
                <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                <span class="cart-count">0</span>
            </a>
        </div>
    </header>

    <main>
        <section class="contact-container">
            <div class="contact-header">
                <h1>Get in Touch</h1>
                <p>Have questions about a product or order? Drop us a message.</p>
            </div>
            
            <div class="contact-card glass">
                <form onsubmit="event.preventDefault(); alert('Message sent! We will contact you soon.'); this.reset();">
                    <div class="form-group">
                        <label for="name">Full Name</label>
                        <input type="text" id="name" class="form-control" placeholder="Jane Doe" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" class="form-control" placeholder="jane@example.com" required>
                    </div>
                    <div class="form-group">
                        <label for="subject">Subject</label>
                        <select id="subject" class="form-control" style="appearance: none; cursor: pointer;">
                            <option value="order">Order Inquiry</option>
                            <option value="product">Product Question</option>
                            <option value="support">Technical Support</option>
                            <option value="other">Other</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea id="message" class="form-control" placeholder="How can we help?" required></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Send Message</button>
                </form>

                <div class="contact-info">
                    <div class="info-item">
                        <div class="info-icon">
                            <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                        </div>
                        <div>
                            <div style="font-weight: 600;">Email Us</div>
                            <div>dawit.ayanssa@gmail.com</div>
                        </div>
                    </div>
                    <div class="info-item">
                        <div class="info-icon">
                            <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path></svg>
                        </div>
                        <div>
                            <div style="font-weight: 600;">Call Us</div>
                            <div>+251920838954 / +251900992930</div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <div class="footer-logo">Darokel Store</div>
            <p>&copy; 2026 Darokel Store Technologies. All rights reserved.</p>
        </div>
    </footer>

    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
