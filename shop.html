<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop | Darokel Store</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="glass">
        <div class="nav-container">
            <a href="index.html" class="logo">Darokel Store</a>
            <nav style="display: flex; align-items: center; gap: 2rem;">
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="contact.html">Contact Us</a></li>
                    <li><a href="shop.html" class="active">Shop</a></li>
                </ul>
                <form class="search-form" onsubmit="event.preventDefault(); window.location.href='shop.html?search='+this.querySelector('.search-input').value;">
                    <input type="text" placeholder="Search products..." class="search-input">
                    <button type="submit" class="search-btn" aria-label="Search">
                        <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    </button>
                </form>
            </nav>
            <a href="cart.html" class="cart-icon" aria-label="Shopping Cart">
                <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                <span class="cart-count">0</span>
            </a>
        </div>
    </header>

    <main>
        <section class="container" style="padding-top: 4rem;">
            <h1 class="section-title">All Products</h1>
            
            <div class="filters">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="phones">Phones</button>
                <button class="filter-btn" data-filter="audio">Audio</button>
                <button class="filter-btn" data-filter="wearables">Wearables</button>
                <button class="filter-btn" data-filter="computers">Computers</button>
                <button class="filter-btn" data-filter="accessories">Accessories</button>
                <button class="filter-btn" data-filter="gaming">Gaming</button>
            </div>

            <div id="productsGrid" class="products-grid">
                <!-- Products dynamically rendered here by app.js -->
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <div class="footer-logo">Darokel Store</div>
            <p>&copy; 2026 Darokel Store Technologies. All rights reserved.</p>
        </div>
    </footer>

    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
